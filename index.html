<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Perfil de investidor · Victor Faleiros</title>
<meta name="description" content="Dez perguntas para o Victor Faleiros saber que carteira montar para você. Leva uns 5 minutos.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ===== Tokens: os mesmos do deck "Plano Fernando Sandes" ===== */
:root{
  --bg:#0B1F33; --paper:#FFFFFF; --paper-2:#F3F5F8; --ink:#0B1F33; --ink-2:#44546A; --ink-3:#7C8797;
  --line:#D9DFE7; --line-2:#EDF0F4; --accent:#0E6E8C; --accent-soft:#E1F0F5; --gold:#B7862B; --gold-soft:#F6EDDA; --red:#B5432E;
  --fan-1:#BFD7F2; --fan-2:#6FA3E0; --fan-3:#1D4F91; --s1:#1D4F91; --s2:#E0762F;
  /* seis caminhos, do mais conservador (B, frio e claro) ao mais arrojado (C, quente e escuro) */
  --c-b:#3472BE; --c-f:#22428D; --c-d:#007681; --c-a:#845B00; --c-e:#C34A00; --c-c:#832E00;
  --sombra:0 30px 80px rgba(0,0,0,.45);
  --marcado:var(--accent-soft);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05101B; --paper:#0F1E2E; --paper-2:#16283A; --ink:#EEF3F8; --ink-2:#B8C4D2; --ink-3:#7F8EA0;
  --line:#2A3B4E; --line-2:#1E2F42; --accent:#5DB9D6; --accent-soft:#12303D; --gold:#D9B45B; --gold-soft:#3A2F14; --red:#E58A76;
  --fan-1:#1D3B63; --fan-2:#3F7AC2; --fan-3:#9CC3F0; --s1:#5B9BE0; --s2:#E9915A;
  --c-b:#9BC9F6; --c-f:#5991ED; --c-d:#57C3CF; --c-a:#E1B850; --c-e:#F58B4B; --c-c:#DE602F;}}
:root[data-theme="dark"]{
  --bg:#05101B; --paper:#0F1E2E; --paper-2:#16283A; --ink:#EEF3F8; --ink-2:#B8C4D2; --ink-3:#7F8EA0;
  --line:#2A3B4E; --line-2:#1E2F42; --accent:#5DB9D6; --accent-soft:#12303D; --gold:#D9B45B; --gold-soft:#3A2F14; --red:#E58A76;
  --fan-1:#1D3B63; --fan-2:#3F7AC2; --fan-3:#9CC3F0; --s1:#5B9BE0; --s2:#E9915A;
  --c-b:#9BC9F6; --c-f:#5991ED; --c-d:#57C3CF; --c-a:#E1B850; --c-e:#F58B4B; --c-c:#DE602F;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;min-height:100vh;min-height:100dvh;padding:12px 12px 56px}
h1,h2,h3{font-family:"Manrope","IBM Plex Sans",system-ui,sans-serif;margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ===== Palco e lâmina ===== */
.palco{display:flex;flex-direction:column;align-items:center;gap:14px}
.lamina{position:relative;width:100%;max-width:560px;background:var(--paper);border-radius:4px;box-shadow:var(--sombra);padding:22px 20px 16px}
.lamina.larga{max-width:880px}
.barra{position:absolute;left:0;top:0;right:0;height:3px;background:var(--line-2);border-radius:4px 4px 0 0;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
.lamina.sem-barra .barra{display:none}
.abaixo{font-size:12px;color:#B8C4D2;letter-spacing:.04em;display:flex;align-items:center;gap:12px;min-height:24px}
.abaixo button{background:none;border:0;color:#B8C4D2;text-decoration:underline;text-underline-offset:3px;padding:8px 6px;cursor:pointer;min-height:44px}
.abaixo .conf{display:flex;align-items:center;gap:6px;color:#EEF3F8}
.abaixo .conf button{text-decoration:none;border:1px solid #2A3B4E;border-radius:3px;padding:6px 10px;min-height:36px;color:#EEF3F8}
.abaixo .conf button.ap{background:#EEF3F8;color:#0B1F33;border-color:#EEF3F8}

/* ===== Cabeçalho da lâmina (faixa .top do deck) ===== */
.top{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:12px}
.top>div{display:contents}
.top .eyebrow{grid-column:1;align-self:center;margin-bottom:0}
.top h2.titulo{grid-column:1 / -1;margin-top:8px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
h2.titulo{font-size:22px;font-weight:700;max-width:34ch;outline:none}
h2.titulo .lead,h1 .lead{color:var(--accent)}
.pill{display:inline-block;padding:3px 8px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);white-space:nowrap;line-height:1.3}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.grey{background:var(--paper-2);color:var(--ink-3)}
.top .pill{grid-column:2;grid-row:1;justify-self:end}
.apoio{color:var(--ink-2);margin-top:12px;font-size:15px;line-height:1.4}
.small{font-size:12.5px;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.foot{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--ink-3);letter-spacing:.05em;border-top:1px solid var(--line-2);padding-top:10px;margin-top:14px}

/* ===== Revelação (.r do deck) ===== */
.r{opacity:0;transform:translateY(10px)}
.tela.on .r{animation:up .55s var(--ease) forwards;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.r{opacity:1;transform:none}.tela.on .r{animation:none}.barra i{transition:none}.lamina{transition:none}}
.tela{display:none}
.tela.on{display:block}

/* ===== KPI ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{background:var(--paper-2);border-left:3px solid var(--accent);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi.gold{border-left-color:var(--gold)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:"Manrope",sans-serif;font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;letter-spacing:.06em;margin-left:4px;color:var(--ink-2);font-family:"IBM Plex Sans",sans-serif;text-transform:uppercase}
.kpi .d{font-size:12.5px;color:var(--ink-2)}

/* ===== Callout ===== */
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 14px;margin-top:16px;line-height:1.45}
.callout.gold{background:var(--gold-soft);border-left-color:var(--gold)}
.callout.dark{background:var(--ink);color:var(--paper);border-left:0}
.callout .eyebrow{margin-bottom:4px}

/* ===== Campos ===== */
.campo{margin-top:22px}
.campo label.rot{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.campo input{width:100%;height:48px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.campo input::placeholder{color:var(--ink-3)}
.campo input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:3px;font-weight:600;color:var(--ink-2);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.erro{color:var(--gold);font-size:13px;margin-top:6px;font-weight:500}
.erro:empty{display:none}
.garantia{margin-top:12px;text-align:center}

/* ===== Botões ===== */
.btn{min-height:48px;padding:0 20px;border-radius:3px;border:0;background:var(--accent);color:#fff;font-weight:700;font-family:"Manrope",sans-serif;font-size:15px;cursor:pointer;letter-spacing:.01em}
:root[data-theme="dark"] .btn{color:#05101B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#05101B}}
.btn:disabled{background:var(--paper-2);color:var(--ink-3);cursor:not-allowed}
.btn.cheio{width:100%;margin-top:22px}
.btn.txt{background:none;color:var(--accent);padding:0 8px;font-family:"IBM Plex Sans",sans-serif;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;min-height:56px;gap:12px}
.nav .btn:not(.txt){min-width:132px}
.pre-nav{text-align:center;margin-top:14px}

/* ===== Listas de opções (linhas de tabela do deck) ===== */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lista{margin-top:14px;border-top:1px solid var(--line)}
.op{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 10px 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer;position:relative;line-height:1.35;margin-left:-3px}
.op.sep{border-top:2px solid var(--ink);margin-top:16px}
.op input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.op .tx{flex:1;min-width:0}
.op .tx b{font-weight:700;font-variant-numeric:tabular-nums}
.op .tx .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.op:has(.desc){padding-top:10px;padding-bottom:10px}
.op .tx .nome{font-family:"Manrope",sans-serif;font-weight:700;font-size:15px;display:block}
.op .tx .desc{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.35;margin-top:1px}
.op .tx:has(.pct){display:flex;align-items:baseline;gap:10px}
.op .pct{font-family:"Manrope",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;flex:0 0 auto;min-width:96px;font-variant-numeric:tabular-nums;line-height:1}
.op .pct.txt{font-size:15px;font-weight:700;letter-spacing:0}
.op .reais{color:var(--ink-2);font-size:14px}
.op .mk{flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:50%;position:relative}
.op.multi .mk{border-radius:2px}
.op:has(input:checked){background:var(--marcado);border-left-color:var(--accent)}
.op:has(input:checked) .mk{border-color:var(--accent);background:var(--accent)}
.op:has(input:checked) .mk::after{content:"";position:absolute;inset:4px;background:var(--paper);border-radius:inherit}
.op.multi:has(input:checked) .mk::after{inset:3px 5px;border-radius:0;background:none;border:2px solid var(--paper);border-top:0;border-left:0;transform:rotate(40deg) translate(-1px,-2px);width:3px;height:8px}
.op:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.op.marcada{background:var(--marcado);border-left-color:var(--accent)}
.op.marcada .mk{border-color:var(--accent);background:var(--accent)}
.op.marcada .mk::after{content:"";position:absolute;inset:4px;background:var(--paper);border-radius:inherit}

/* ===== Abertura ===== */
.capa h1{font-size:34px;font-weight:800;margin-top:6px}
.capa .apoio{margin-top:10px}
.capa .foot{margin-top:22px}
.retomada{margin-top:18px}
.retomada h3{font-size:20px;font-weight:700}
.retomada p{margin-top:8px;color:var(--ink-2)}
.retomada .conf{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.retomada .nav{flex-wrap:wrap}
@media (max-width:759px){.retomada .nav .btn:not(.txt){width:100%}}

/* ===== Tela 6: gráfico vivo ===== */
.t6 .apoio{margin-top:10px;font-size:14px}
.leitura{height:56px;margin-top:10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.leitura .l1{display:flex;justify-content:space-between;align-items:center;min-height:24px}
.leitura .mes{font-family:"Manrope",sans-serif;font-weight:700;font-size:15px}
.leitura .l2{display:flex;flex-wrap:nowrap;gap:0 4px;font-size:13px;align-items:baseline;white-space:nowrap;overflow:hidden}
@media (min-width:760px){.leitura .l2{font-size:14px;gap:0 6px}}
.leitura .l2 .u{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-left:2px}
.leitura .cv{display:inline-flex;gap:3px;align-items:baseline;border-bottom:2px solid transparent;padding-bottom:1px}
.leitura .cv.sel{border-bottom-color:var(--cor)}
.leitura .cv i{font-style:normal;font-family:"Manrope",sans-serif;font-weight:800;color:var(--cor)}
.leitura .cv b{font-weight:600;font-variant-numeric:tabular-nums}
.leitura .sep{color:var(--ink-3)}
.leitura .fim{min-height:24px;padding:0 6px;font-size:13px}
.leitura .fim[hidden]{display:none}
.palco-g{position:relative;margin-top:6px;outline-offset:4px;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair}
.palco-g svg{display:block;width:100%;height:236px;overflow:visible}
.palco-g svg text{font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;fill:var(--ink-3);font-size:11px}
.palco-g svg .cam{fill:none;stroke-width:2;stroke:var(--cor);stroke-linejoin:round;stroke-linecap:round;transition:opacity .25s,stroke-width .25s}
.palco-g svg .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.palco-g.tem-sel svg .cam{opacity:.35}
.palco-g.tem-sel svg .cam.sel{opacity:1;stroke-width:3}
.palco-g.tem-previa svg .cam{opacity:.35}
.palco-g.tem-previa svg .cam.previa{opacity:1;stroke-width:3}
.palco-g svg .letra{font-family:"Manrope",sans-serif;font-weight:800;font-size:12px;fill:var(--cor);opacity:0;transition:opacity .4s}
.palco-g.fim-anim svg .letra{opacity:1}
.palco-g svg .faixa{fill:var(--ink);opacity:0;transition:opacity .5s}
.palco-g.marcos-on svg .faixa{opacity:.035}
.palco-g svg .faixa.aberta{opacity:.07}
.palco-g svg .filete{stroke:var(--accent);stroke-width:1.5;opacity:0}
.palco-g svg .filete.aberta{opacity:1}
.palco-g svg .hair{stroke:var(--ink);stroke-width:1;opacity:.9}
.palco-g svg .pt{fill:var(--cor);stroke:var(--paper);stroke-width:1.5}
.marcos{position:relative;height:44px;margin-top:-2px;opacity:0;transition:opacity .5s}
.marcos.on{opacity:1}
.marco{position:absolute;top:0;width:44px;height:44px;margin-left:-22px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.marco i{width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);color:var(--accent);font-style:normal;font-weight:700;font-family:"Manrope",sans-serif;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.marco[aria-expanded="true"] i{background:var(--accent);color:var(--paper)}
.marco:focus-visible{outline:none}
.marco:focus-visible i{outline:2px solid var(--accent);outline-offset:2px}
.dica{margin-top:2px;text-align:center;opacity:0;transition:opacity .5s}
.dica.on{opacity:1}
.card-marco{margin-top:12px}
.card-marco .tit{font-family:"Manrope",sans-serif;font-weight:700;font-size:17px;margin-top:2px}
.card-marco p.tx{margin-top:6px;color:var(--ink-2);font-size:14px}
.card-marco .quedas{margin-top:10px;font-size:13.5px}
.card-marco .quedas .rot{color:var(--ink-2);display:block;margin-bottom:4px;font-size:12.5px}
.card-marco .quedas .cv{display:inline-flex;gap:3px;align-items:baseline;margin-right:6px}
.card-marco .quedas .cv i{font-style:normal;font-family:"Manrope",sans-serif;font-weight:800;color:var(--cor)}
.card-marco .quedas .cv b{font-weight:600;font-variant-numeric:tabular-nums}
.card-marco .acoes{margin-top:8px;display:flex;justify-content:flex-end}
.pergunta{margin-top:20px}
.pergunta h2.titulo{font-size:20px}
.pergunta .apoio{margin-top:8px;font-size:14px}
.cams{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cam-k{position:relative;display:block;cursor:pointer;background:var(--paper-2);border-left:3px solid var(--cor);padding:10px 12px;line-height:1.35;transition:border-left-width .15s,background .15s;opacity:1}
.cam-k input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.cam-k .l1{display:flex;align-items:baseline;gap:8px}
.cam-k .letra{font-family:"Manrope",sans-serif;font-weight:800;font-size:24px;color:var(--cor);line-height:1;min-width:22px}
.cam-k .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:600}
.cam-k .v{font-family:"Manrope",sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.cam-k .pill{margin-left:auto;visibility:hidden}
.cam-k .l2,.cam-k .l3{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
.cam-k .l2 b,.cam-k .l3 b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.cam-k:has(input:checked),.cam-k.marcada{background:var(--marcado);border-left-width:6px}
.cam-k:has(input:checked) .pill,.cam-k.marcada .pill{visibility:visible}
.cam-k:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.t6 .cams .cam-k{opacity:0;transform:translateY(10px)}
.t6 .cams.on .cam-k{animation:up .45s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms)}
.t6 .pergunta{opacity:0;transition:opacity .4s}
.t6 .pergunta.on{opacity:1}
.nota{margin-top:10px}
.tabela{margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabela th,.tabela td{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:600;background:var(--paper-2)}
td.r,th.r{text-align:right;white-space:nowrap}
td .letra{font-family:"Manrope",sans-serif;font-weight:800;color:var(--cor)}
.t6 .linha-tab{margin-top:8px;display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.t6 .cams .cam-k{opacity:1;transform:none;animation:none}.t6 .pergunta{opacity:1}.marcos,.dica{opacity:1}.palco-g svg .letra{opacity:1}}

/* ===== Envio ===== */
.envio{padding:28px 0 12px;text-align:left}
.linha-cresce{height:2px;background:var(--line);margin-top:18px;overflow:hidden}
.linha-cresce i{display:block;height:100%;width:0;background:var(--accent);animation:cresce 15s linear forwards}
@keyframes cresce{to{width:100%}}
@media (prefers-reduced-motion:reduce){.linha-cresce i{animation:none;width:40%}}
.envio h2.titulo{font-size:26px}
.envio h2.titulo.grande{font-size:30px;font-weight:800}
.envio .apoio{margin-top:12px}

/* ===== Computador ===== */
@media (min-width:760px){
  body{padding:28px 24px 64px}
  .lamina{padding:30px 32px 20px}
  h2.titulo{font-size:24px}
  .capa h1{font-size:40px}
  .btn.cheio{width:auto;min-width:200px}
  .t6-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
  .t6-grid .pergunta{margin-top:0}
  .t6-grid .pergunta h2.titulo{font-size:19px}
  .palco-g svg{height:300px}
}

</style>
</head>

const DERIV = {};

  const s=SERIE[L].serie; let topo=s[0], topoI=0, mdd=0, mddI=0, mddTopo=s[0];

  for(let i=1;i<s.length;i++){

    else { if(under===0) curIni=topoI; under++; const dd=s[i]/topo-1; if(dd<mdd){mdd=dd; mddI=i; mddTopo=topo;} }
  }
  if(under>maxUnder){maxUnder=under; uIni=curIni; uFim=s.length-1;}

}

function mascaraWa(v){ const d=v.replace(/\D/g,'').slice(0,11); if(!d) return ''; if(d.length<=2) return '('+d; const ddd=d.slice(0,2), r=d.slice(2); if(r.length<=4) return `(${ddd}) ${r}`; if(r.length<=8) return `(${ddd}) ${r.slice(0,4)}-${r.slice(4)}`; return `(${ddd}) ${r.slice(0,5)}-${r.slice(5)}`; }

    <div class="t6-dir">
      <div class="pergunta" id="pergunta"><h2 class="titulo" style="font-size:20px">Qual desses caminhos você <span class="lead">toparia viver</span> nos próximos 10 anos?</h2><p class="apoio">Olhe quanto virou, mas também a maior queda e o tempo sem recuperar. Não tem resposta certa.</p></div>
      <fieldset class="cams" id="cams"><legend>Qual desses caminhos você toparia viver nos próximos 10 anos?</legend>${htmlCartoes()}</fieldset>
      <p class="small nota">Quedas em reais calculadas sobre o valor que a carteira tinha na hora.</p>
      <div class="linha-tab"><button type="button" class="btn txt" id="ver-tabela" aria-expanded="false">Ver em tabela</button></div>
    </div>
  </div>
  <div class="tabela" id="tabela" hidden>${htmlTabela()}</div>
  ${htmlNav(6,'Próxima',!!E.respostas.t2)}${htmlFoot(6)}</div>`;
}

let t6Anim=null; // controle da animação em curso
function ligarTela6(sec){
  const palco=$('#palco-g',sec), svg=$('#svg-g',sec), marcosEl=$('#marcos',sec), dica=$('#dica',sec), pergunta=$('#pergunta',sec), cams=$('#cams',sec);
  const N=121, H=parseFloat(getComputedStyle(svg).height)||236; let W=palco.clientWidth||326;
  const m={l:4,r:22,t:14,b:30}; const Y0=78000, Y1=350000;
  let X=i=>m.l+(i/(N-1))*(W-m.l-m.r), Y=v=>H-m.b-((v-Y0)/(Y1-Y0))*(H-m.t-m.b);
  let idx=0, marcoAberto=null, previa=null;
  const svgNS='http://www.w3.org/2000/svg';
  function desenhar(){
    W=palco.clientWidth||326; X=i=>m.l+(i/(N-1))*(W-m.l-m.r);
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const cid='clip-g';
    let s=`<defs><clipPath id="${cid}"><rect id="clip-rect" x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
    // faixas dos marcos
    MARCOS.marcos.forEach((mk,i)=>{ s+=`<rect class="faixa" data-m="${mk.id}" x="${X(mk.inicio)}" y="${m.t}" width="${X(mk.fim)-X(mk.inicio)}" height="${H-m.t-m.b}"/>`; s+=`<line class="filete" data-m="${mk.id}" x1="${X(mk.pior)}" x2="${X(mk.pior)}" y1="${m.t}" y2="${H-m.b}"/>`; });
    // hairlines 200 e 300 mil, rótulo 100 mil
    [200000,300000].forEach(v=>{ s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${m.l+2}" y="${Y(v)-4}">${v/1000} mil</text>`; });
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(100000)}" y2="${Y(100000)}" stroke="var(--line)"/><text x="${m.l+2}" y="${Y(100000)+13}" style="fill:var(--ink-2);font-weight:600">R$ 100 mil</text>`;
    // eixo
    [2016,2018,2020,2022,2024,2025].forEach(a=>{ const i=a===2025?N-1:(a-2016)*12; s+=`<text x="${X(i)}" y="${H-m.b+16}" text-anchor="${a===2016?'start':a===2025?'end':'middle'}">${a}</text>`; });
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--line)"/>`;
    // linhas
    s+=`<g clip-path="url(#${cid})">`;
    ORDEM.slice().reverse().forEach(L=>{ const sr=SERIE[L].serie; let d=''; for(let i=0;i<N;i++) d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(sr[i]).toFixed(1); s+=`<path class="cam" data-l="${L}" style="--cor:${COR[L]}" d="${d}"/>`; });
    s+=`</g>`;
    // letras na ponta (afastadas)
    const pontas=ORDEM.map(L=>({L,y:Y(SERIE[L].serie[N-1])})).sort((a,b)=>a.y-b.y);
    for(let i=1;i<pontas.length;i++){ if(pontas[i].y-pontas[i-1].y<12) pontas[i].y=pontas[i-1].y+12; }
    pontas.forEach(p=>{ s+=`<text class="letra" data-l="${p.L}" style="--cor:${COR[p.L]}" x="${W-m.r+6}" y="${p.y+4}">${p.L}</text>`; });
    // hit paths para prévia no mouse
    ORDEM.forEach(L=>{ const sr=SERIE[L].serie; let d=''; for(let i=0;i<N;i++) d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(sr[i]).toFixed(1); s+=`<path class="hit" data-l="${L}" d="${d}"/>`; });
    // leitura
    s+=`<g id="leitura-g"><line class="hair" id="hair" y1="${m.t}" y2="${H-m.b}"/>${ORDEM.map(L=>`<circle class="pt" data-l="${L}" style="--cor:${COR[L]}" r="3.5"/>`).join('')}</g>`;
    svg.innerHTML=s;
    posicionarMarcos(); lerMes(idx,false);
    if(marcoAberto) marcarMarco(marcoAberto,true);
  }
  function posicionarMarcos(){
    marcosEl.innerHTML=MARCOS.marcos.map((mk,i)=>`<button type="button" class="marco" data-m="${mk.id}" style="left:${X(mk.pior)}px" aria-expanded="${marcoAberto===mk.id}" aria-label="Marco ${i+1}: ${esc(mk.titulo)}, ${esc(mk.periodo)}"><i aria-hidden="true">${i+1}</i></button>`).join('');
    $$('.marco',marcosEl).forEach(b=>b.addEventListener('click',()=>abrirMarco(b.dataset.m)));
  }
  let anuncioT=null;
  function lerMes(i,registra){
    idx=Math.max(0,Math.min(N-1,i));
    const x=X(idx); const hair=$('#hair',svg); if(hair){ hair.setAttribute('x1',x); hair.setAttribute('x2',x); }
    $$('.pt',svg).forEach(c=>{ c.setAttribute('cx',x); c.setAttribute('cy',Y(SERIE[c.dataset.l].serie[idx])); });
    $('#mes',sec).textContent=nomeMes(idx);
    $('#valores',sec).innerHTML=ORDEM.map((L,i)=>`<span class="cv${E.respostas.t2==='t2_'+L.toLowerCase()?' sel':''}" style="--cor:${COR[L]}"><i>${L}</i><b>${Math.round(SERIE[L].serie[idx]/1000)}</b></span>${i<5?'<span class="sep">·</span>':''}`).join('')+'<span class="u">R$ mil</span>';
    $('#ate-fim',sec).hidden = (idx===N-1);
    if(registra){ if(!E.t2LeuMeses){ E.t2LeuMeses=true; salvar(); } clearTimeout(anuncioT); anuncioT=setTimeout(()=>{ $('#anuncio-leitura').textContent=nomeMes(idx)+': '+ORDEM.map(L=>L+' '+Math.round(SERIE[L].serie[idx]/1000)).join(', ')+' mil reais'; },500); }
  }
  function idxDoX(clientX){ const r=svg.getBoundingClientRect(); const px=(clientX-r.left)*(W/r.width); return Math.round((px-m.l)/(W-m.l-m.r)*(N-1)); }
  // leitura por dedo e mouse
  let pd=null, arrastando=false;
  palco.addEventListener('pointerdown',e=>{ if(t6Anim){ pularAnimacao(); } pd={x:e.clientX,y:e.clientY,id:e.pointerId}; arrastando=false; });
  palco.addEventListener('pointermove',e=>{
    if(e.pointerType==='mouse'){ if(!pd||true){ lerMes(idxDoX(e.clientX),true); } return; }
    if(!pd) return; const dx=e.clientX-pd.x, dy=e.clientY-pd.y;
    if(!arrastando && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){ arrastando=true; try{ palco.setPointerCapture(pd.id); }catch(x){} }
    if(arrastando){ lerMes(idxDoX(e.clientX),true); }
  });
  palco.addEventListener('pointerup',e=>{ if(pd && !arrastando && e.pointerType!=='mouse'){ lerMes(idxDoX(e.clientX),true); } if(pd && e.pointerType==='mouse' && !arrastando){ lerMes(idxDoX(e.clientX),true); } pd=null; arrastando=false; });
  palco.addEventListener('pointercancel',()=>{ pd=null; arrastando=false; });
  palco.addEventListener('keydown',e=>{ const k=e.key; if(k==='ArrowLeft'){ e.preventDefault(); lerMes(idx-1,true); } else if(k==='ArrowRight'){ e.preventDefault(); lerMes(idx+1,true); } else if(k==='Home'){ e.preventDefault(); lerMes(0,true); } else if(k==='End'){ e.preventDefault(); lerMes(N-1,true); } });
  // prévia ao passar o mouse na linha ou na letra
  svg.addEventListener('pointerover',e=>{ const el=e.target.closest('.hit,.letra'); if(el && e.pointerType==='mouse'){ previa=el.dataset.l; palco.classList.add('tem-previa'); $$('.cam',svg).forEach(p=>p.classList.toggle('previa',p.dataset.l===previa)); } });
  svg.addEventListener('pointerout',e=>{ const el=e.target.closest('.hit,.letra'); if(el){ previa=null; palco.classList.remove('tem-previa'); $$('.cam.previa',svg).forEach(p=>p.classList.remove('previa')); } });
  $('#ate-fim',sec).addEventListener('click',()=>lerMes(N-1,true));
  // marcos
  function marcarMarco(id,on){ $$('.faixa,.filete',svg).forEach(el=>el.classList.toggle('aberta', on && el.dataset.m===id)); $$('.marco',marcosEl).forEach(b=>b.setAttribute('aria-expanded', String(on && b.dataset.m===id))); }
  function abrirMarco(id){
    if(marcoAberto===id){ fecharMarco(); return; }
    marcoAberto=id; const i=MARCOS.marcos.findIndex(x=>x.id===id); const mk=MARCOS.marcos[i];
    marcarMarco(id,true); lerMes(mk.pior,false);
    if(!E.t2MarcosAbertos.includes(id)){ E.t2MarcosAbertos.push(id); salvar(); }
    $('#card-marco',sec).innerHTML=`<div class="callout card-marco" role="region" aria-label="Marco ${i+1}: ${esc(mk.titulo)}"><div class="eyebrow">Marco ${i+1} · ${esc(mk.periodo)}</div><div class="tit">${esc(mk.titulo)}</div><p class="tx">${esc(mk.texto)}</p>
      <div class="quedas"><span class="rot">Quanto cada caminho caiu aqui</span>${ORDEM.map(L=>`<span class="cv" style="--cor:${COR[L]}"><i>${L}</i><b>${fmtPct(quedaNoMarco(L,mk))}</b></span>`).join('<span class="sep muted">· </span>')}</div>
      <div class="acoes"><button type="button" class="btn txt" id="fechar-marco">Fechar</button></div></div>`;
    $('#fechar-marco',sec).addEventListener('click',fecharMarco);
    const card=$('.card-marco',sec); requestAnimationFrame(()=>{ const r=card.getBoundingClientRect(); if(r.bottom>window.innerHeight) window.scrollBy({top:r.bottom-window.innerHeight+16,behavior:reduzido?'auto':'smooth'}); });
  }
  function fecharMarco(){ marcoAberto=null; marcarMarco(null,false); $('#card-marco',sec).innerHTML=''; }
  // cartões
  function aplicarSelecao(){ const v=E.respostas.t2; const L=v? v.slice(3).toUpperCase():null; palco.classList.toggle('tem-sel',!!L); $$('.cam',svg).forEach(p=>p.classList.toggle('sel',p.dataset.l===L)); $$('.cv',$('#valores',sec)).forEach((el,i)=>el.classList.toggle('sel',ORDEM[i]===L)); $$('.cam-k',cams).forEach(l=>l.classList.toggle('marcada',$('input',l).checked)); $('#avancar',sec).disabled=!L; }
  $$('input',cams).forEach(inp=>inp.addEventListener('change',()=>{ E.respostas.t2=inp.value; salvar(); aplicarSelecao(); }));
  $('#ver-tabela',sec).addEventListener('click',e=>{ const tb=$('#tabela',sec); const ab=tb.hidden; tb.hidden=!ab; e.currentTarget.setAttribute('aria-expanded',String(ab)); e.currentTarget.textContent=ab?'Esconder tabela':'Ver em tabela'; });
  $('#voltar',sec).addEventListener('click',()=>irPara(5));
  $('#avancar',sec).addEventListener('click',()=>{ if(E.respostas.t2) irPara(7); });
  // estado final x animação
  function estadoFinal(){ palco.classList.add('fim-anim'); marcosEl.classList.add('on'); dica.classList.add('on'); pergunta.classList.add('on'); cams.classList.add('on'); const cr=$('#clip-rect',svg); if(cr) cr.setAttribute('width',W); lerMes(N-1,false); aplicarSelecao(); }
  function pularAnimacao(){ if(!t6Anim) return; clearInterval(t6Anim.raf); clearTimeout(t6Anim.t1); clearTimeout(t6Anim.t2); t6Anim=null; estadoFinal(); E.t2Visto=true; salvar(); }
  function animar(){
    const cr=$('#clip-rect',svg); cr.setAttribute('width',0); lerMes(0,false); $('#ate-fim',sec).hidden=true;
    const dur=2400, ini=performance.now()+400; t6Anim={raf:0,t1:0,t2:0};
    const passo=()=>{ const now=performance.now(); if(!t6Anim) return; const p=Math.max(0,Math.min(1,(now-ini)/dur)); const e=1-Math.pow(1-p,2); cr.setAttribute('width',(m.l+e*(W-m.l-m.r)+2).toFixed(1)); lerMes(Math.round(e*(N-1)),false); $('#ate-fim',sec).hidden=true; if(p<1){ /* o intervalo continua */ } else { clearInterval(t6Anim.raf); palco.classList.add('fim-anim'); cr.setAttribute('width',W); t6Anim.t1=setTimeout(()=>{ marcosEl.classList.add('on'); dica.classList.add('on'); },200); t6Anim.t2=setTimeout(()=>{ pergunta.classList.add('on'); cams.classList.add('on'); t6Anim=null; E.t2Visto=true; salvar(); lerMes(N-1,false); },600); } };
    t6Anim.raf=setInterval(passo,16);
  }
  desenhar();
  if(reduzido || E.t2Visto){ estadoFinal(); } else { animar(); }
  window.addEventListener('resize',()=>{ if(telaAtual!==6) return; const vis=palco.classList.contains('fim-anim'); desenhar(); if(vis){ const cr=$('#clip-rect',svg); if(cr) cr.setAttribute('width',W); aplicarSelecao(); } });
}

/* ======================================================================
   Envio
   ====================================================================== */
let ultimoContrato=null, emEnvio=false;
function montarContrato(){
  const r=E.respostas; const agora=new Date(); const ini=E.iniciadoEm?new Date(E.iniciadoEm):agora;
  return {
    nome:(E.nome||'').trim(), contato:(E.contato||'').trim(), contato_tipo:E.contatoTipo, versao_formulario:VERSAO, origem:'formulario_perfil_v3', user_agent:navigator.userAgent,
    respostas:{ contato_tipo:E.contatoTipo, horizonte_uso:r.horizonte_uso||null, previsibilidade_renda:r.previsibilidade_renda||null, reserva_emergencia:r.reserva_emergencia||null, dependencia_carteira:r.dependencia_carteira||null,
      t1:r.t1||null, t2:r.t2||null, t3:r.t3||null, t4:r.t4||null, t4_hipotetico: r.t4==='t4_nunca_passei' ? (r.t4_hipotetico||null) : null,
      e1:Array.isArray(r.e1)?r.e1:[], e2:r.e2||null,
      _meta:{ iniciado_em:isoLocal(ini), enviado_em:isoLocal(agora), tempo_segundos:Math.max(0,Math.round((agora-ini)/1000)), retomou:!!E.retomou, nome_na_url:!!E.nomeNaUrl, largura_tela:window.innerWidth, t2_leu_meses:!!E.t2LeuMeses, t2_marcos_abertos:E.t2MarcosAbertos.slice() } } };
}
async function enviar(){
  if(emEnvio) return;
  emEnvio=true; ultimoContrato=montarContrato(); irPara('enviando');
  const inicio=performance.now(); const ctrl=new AbortController(); const limite=setTimeout(()=>ctrl.abort(), ENVIO_LIMITE_MS);
  let ok=false;
  try{
    const resp=await fetch(SUPABASE_URL,{method:'POST',signal:ctrl.signal,headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(ultimoContrato)});
    ok=resp.ok;
  }catch(e){ ok=false; }
  clearTimeout(limite);
  // a tela Enviando fica ao menos 600 ms para nao piscar
  const falta=600-(performance.now()-inicio); if(falta>0) await new Promise(r=>setTimeout(r,falta));
  emEnvio=false;
  if(ok) renderRecebido(); else renderErro();
}
function renderRecebido(){ apagarSalvo(); irPara('recebido'); }
function renderErro(){ if(!ultimoContrato) ultimoContrato=montarContrato(); irPara('erro'); }
function htmlEnviando(){ return `<div class="envio"><div class="eyebrow r">Enviando</div><h2 class="titulo r" id="titulo">Guardando as suas respostas</h2><div class="linha-cresce r"><i></i></div><p class="apoio r">Só um instante.</p></div>`; }
function htmlRecebido(){ const nm=primeiroNome(E.nome)||'você'; return `<div class="envio"><div class="eyebrow r">Recebido</div><h2 class="titulo grande r" id="titulo">Obrigado, <span class="lead">${esc(nm)}</span>.</h2><div class="callout r">O Victor vai ler tudo com calma e apresenta o resultado na conversa de vocês. Pode fechar esta página.</div><p class="small r" style="margin-top:12px">Se lembrar de algo, é só mandar mensagem para ele.</p></div><div class="foot"><span>Victor Faleiros · Perfil de investimentos</span><span class="num">10 / 10</span></div>`; }
function htmlErro(){ return `<div class="envio"><div class="eyebrow r">Quase lá</div><h2 class="titulo r" id="titulo">Não consegui enviar agora</h2><div class="callout gold r">Toque no botão abaixo para mandar as suas respostas ao Victor por e-mail. Já vai tudo preenchido.</div><div class="nav r" style="justify-content:flex-start;gap:8px"><a class="btn" id="mailto" href="#" style="display:inline-flex;align-items:center;text-decoration:none">Enviar por e-mail</a><button type="button" class="btn txt" id="tentar">Tentar de novo</button></div><p class="small r">As suas respostas continuam guardadas neste aparelho enquanto isso.</p></div>`; }
function textoOpcao(chave,id){ for(const k of Object.keys(PERGUNTAS)){ const p=PERGUNTAS[k]; if(p.chave===chave){ const o=p.opcoes.find(x=>x.id===id); if(o) return o.html.replace(/<span class="(sub|desc)">.*?<\/span>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); } } return id||''; }
function corpoEmail(c){
  const r=c.respostas; const L=r.t2?r.t2.slice(3).toUpperCase():null; const d=L?DERIV[L]:null;
  const linhas=[`Perfil de investimentos: ${c.nome}`,`Contato (${r.contato_tipo}): ${c.contato}`,'',
    'BLOCO 1 · COM O QUE VOCÊ PODE CONTAR',`Quando vai usar: ${textoOpcao('horizonte_uso',r.horizonte_uso)}`,`Como é a sua renda: ${textoOpcao('previsibilidade_renda',r.previsibilidade_renda)}`,`Se a renda parasse: ${textoOpcao('reserva_emergencia',r.reserva_emergencia)}`,`O investido paga conta: ${textoOpcao('dependencia_carteira',r.dependencia_carteira)}`,'',
    'BLOCO 2 · COMO VOCÊ LIDA COM OSCILAÇÃO',`Retrato: ${textoOpcao('t1',r.t1)}`, d?`Seis caminhos: ${L} (virou ${fmtMil(d.fim)}, maior queda ${fmtPct(d.mdd)}, ${d.meses} meses sem recuperar)`:'Seis caminhos: ', `Queda que você topa: ${textoOpcao('t3',r.t3)}`,`Na última queda forte: ${textoOpcao('t4',r.t4)}`, r.t4_hipotetico?`Se acontecesse: ${textoOpcao('t4_hipotetico',r.t4_hipotetico)}`:null,'',
    'BLOCO 3 · SUA EXPERIÊNCIA',`O que você já teve: ${(r.e1||[]).map(i=>textoOpcao('e1',i)).join('; ')}`,`Em qual crise já investia: ${textoOpcao('e2',r.e2)}`,'',
    'Código técnico: '+JSON.stringify(c)].filter(x=>x!==null);
  return linhas.join('\n');
}
function ligarEnvio(sec,t){
  if(t==='erro'){ const c=ultimoContrato||montarContrato(); $('#mailto',sec).href='mailto:'+EMAIL_RESERVA+'?subject='+encodeURIComponent('Perfil de investidor - '+c.nome)+'&body='+encodeURIComponent(corpoEmail(c)); $('#tentar',sec).addEventListener('click',enviar); }
}

function ligar(sec,t){
  if(t===0) ligarAbertura(sec);
  else if(t===6) ligarTela6(sec);
  else if(PERGUNTAS[t]) ligarPergunta(sec,t);
  else ligarEnvio(sec,t);
}


/* ======================================================================
   Início
   ====================================================================== */
irPara(0);
</script>
